<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="contact.css">
</head>
<body>
  <header class="en-tete">
    <div class="conteneur en-tete-contenu">
      <a href="accueil.html" class="logo">Élan Fitness</a>

      <nav aria-label="Navigation principale">
        <ul class="menu">
          <li><a href="accueil.html" class="lien-actif">Accueil</a></li>
          <li><a href="a-propos.html">À propos</a></li>
          <li><a href="programmes.html">Programmes</a></li>
          <li><a href="contact-us.html">Contact Us</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section id="Get in Touch" class="section">
      <div class="conteneur">
        <h2>Get in Touch</h2>
        <p>
          You have questions or need additional information? Don't hesitate to contact us!
        </p>
      </div>
      <form action="#" method="post" class="contact-form">
        <div class="form-group">
          <label for="Email">elanfitness@hotmail.com</label>
        </div>
        <div class="form-group">
          <label for="Adresse">12 rue des Palmiers, 20000 Casablanca</label>
        </div>
        <div class="form-group">
          <label for="Téléphone">+212 6 12 34 56 78</label>
        </div>
      </form>
    </section>
    <section id="contact" class="section">
      <div class="conteneur">
        <h2>Contact Us</h2>
        <p>
          You have questions or need additional information? Don't hesitate to contact us!
        </p>
      </div>
      <form action="#" method="post" class="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="bouton bouton-principal">Send Message</button>
      </form>
    </section>
  </main>
</body>
</html>
