<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contactez nous</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="contact.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="en-tete">
    <div class="conteneur en-tete-contenu">
      <a href="accueil.html" class="logo"><img src="img/Logo de fitness Élan Fitness transparent.png" alt="logo-img">Élan Fitness</a>
      <nav aria-label="Navigation principale">
        <ul class="menu">
          <li><a href="accueil.html">Accueil</a></li>
          <li><a href="a-propos.html">À propos</a></li>
          <li><a href="programmes.html">Programmes</a></li>
          <li><a href="contact-us.html" class="lien-actif">Contactez-nous</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    
    <section id="contact" class="section">
      <div class="contact-container">
        <div class="contact-box">
          <div class="left"></div>
          <div class="right">
            <h2>Contactez-Nous</h2>
            <form>
            <table>
              <tr>
                <td><input type="text" class="field" placeholder="Nom" required></td>
              </tr>
              <tr>
                <td><input type="text" class="field" placeholder="Prénom" required></td>
              </tr>

              <tr>
                <td><input type="email" class="field" placeholder="example@gmail.com" required></td>
              </tr>

              <tr>
                <td><textarea class="field" placeholder="Message" required></textarea></td>
              </tr>

              <tr>
                <td><button class="btn">Envoyer</btn></td>
              </tr>
            </table>
            </form>
          </div>
        </div>
      </div>
    </section>
    <footer class="pied-de-page">
    <div class="conteneur">

      <div class="pied-haut">
        <div>
          <p class="logo logo-clair"><img src="img/Logo de fitness Élan Fitness transparent.png">Élan Fitness</p>
          <p class="slogan">Ton énergie, ton rythme.</p>
        </div>

        <nav aria-label="Navigation du pied de page">
          <ul class="menu menu-pied">
            <li><a href="accueil.html">Accueil</a></li>
            <li><a href="a-propos.html">À propos</a></li>
            <li><a href="programmes.html">Programmes</a></li>
            <li><a href="contact-us.html">Contactez-nous</a></li>
          </ul>
        </nav>
      </div>

      <div class="pied-bas">
        <p>Adresse : 12 rue des Palmiers, 20000 Casablanca</p>
        <p>&copy; 2026 Élan Fitness — Projet pédagogique fictif</p>
      </div>

    </div>
  </footer>
  </main>
</body>
</html>
